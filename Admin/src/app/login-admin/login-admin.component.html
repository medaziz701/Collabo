<div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5 position-relative">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xxl-4 col-lg-5" style="width: 800px; height: 600px;">
                <div class="card">
                    <div class="card-header py-4 text-center custom-card-header">
                        <a href="index.html">
                            <span><img src="assets/assets/images/LOGO1.png" alt="LOGO1" height="100"></span>
                        </a>
                    </div>

                    <div class="card-body p-4">
                        <div class="text-center w-75 m-auto">
                            <h4 class="text-dark-50 text-center pb-0 fw-bold">Sign In</h4>
                            <p class="text-muted mb-4">Enter your email address and password to access admin panel.</p>
                        </div>

                        <form (ngSubmit)="login()" [formGroup]="loginForm">
                            <div class="form-group">
                                <label>Email Admin</label>
                                <input type="email" formControlName="email" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Mot de passe</label>
                                <input type="password" formControlName="mp" class="form-control">
                            </div>

                            <div [innerHTML]="messageCommande"></div>

                            <button type="submit" class="btn btn-primary">Connexion Admin</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
